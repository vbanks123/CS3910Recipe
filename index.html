<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Search Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame">
    <div class="browser-bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <main class="page">

      <header class="top">
        <div class="brand">
          <div>
            <div class="brand-name">RecipeFinder</div>
            <div class="brand-sub">Search recipes with your location!</div>
          </div>
        </div>

        <form class="search">
          <input type="text" value="soup" aria-label="Search recipes" />
          <button type="button">Search</button>
        </form>
      </header>

      <section class="filters">
        <button class="chip">Vegetarian</button>
        <button class="chip">Gluten-free</button>


          </select>
        </div>
      </section>

      <div class="results-head">
        <h1>Results for “soup”</h1>
        <p>Showing 3 recipes</p>
      </div>

      <article class="result">
        <div class="result-left">
          <h2 class="title">Classic Chicken Noodle Soup</h2>
          <div class="actions">
            <button class="btn primary">View Recipe</button>
          </div>
        </div>

        <div class="result-right">
          <img
            class="thumb"
            src="https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=900&q=80"
            alt="Soup"
          />
        </div>
      </article>

      <article class="result">
        <div class="result-left">
          <h2 class="title">Creamy Tomato Basil Soup</h2>
          <div class="actions">
            <button class="btn primary">View Recipe</button>
          </div>
        </div>

        <div class="result-right">
          <img
            class="thumb"
            src="https://images.unsplash.com/photo-1604909052743-94e838986d24?auto=format&fit=crop&w=900&q=80"
            alt="Tomato Soup"
          />
        </div>
      </article>

      <article class="result">
        <div class="result-left">
          <h2 class="title">Quick Vegetable Soup</h2>
          <div class="actions">
            <button class="btn primary">View Recipe</button>
          </div>
        </div>

        <div class="result-right">
          <img
            class="thumb"
            src="https://picfiles.alphacoders.com/272/272777.jpg?auto=format&fit=crop&w=900&q=80"
            alt="Vegetable Soup"
          />
        </div>
      </article>

    </main>
  </div>
</body>
</html>
