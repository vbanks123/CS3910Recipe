<!doctype html>
<html lang="en">


    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Season by Season</title>


        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">


        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>


    <body>

        <div class="page"> 

            <div class="mx-auto search-wrap mb-4 d-flex gap-2">
                <input type="text" class="form-control search-input"  placeholder="Search recipes by ingredient..." aria-label="Search">
            <button class="btn btn-outline-dark">Search</button>
            
            
            </div>

                <div class="content-wrap">
                    <div class="d-flex justify-content-center gap-4 mb-5">
                        <button class="season-btn spring" type="button">Spring</button>
                        <button class="season-btn summer" type="button">Summer</button>
                        <button class="season-btn fall" type="button">Fall</button>
                        <button class="season-btn winter" type="button">Winter</button>
                    </div>

                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h1>Season by Season</h1>
                            <p class="subtext mb-0">Select to access free, fresh recipes.</p>
                        </div>

                        <div class="dropdown">
                            <button class="filter-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                                Filter by Allergies
                            </button>

                            <ul class="dropdown-menu p-3">
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" id="dairy">
                                    <label class="form-check-label" for="dairy">Dairy</label>
                                </li>
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" id="gluten">
                                    <label class="form-check-label" for="gluten">Gluten</label>
                                </li>
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" id="nuts">
                                    <label class="form-check-label" for="nuts">Tree Nuts</label>
                                </li>
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" id="soy">
                                    <label class="form-check-label" for="soy">Soy</label>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        
        </div>
    
    </body>


</html>
