<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results | Season by Season</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <div class="content-wrap">
        <!-- Top header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <a href="home.html" class="text-decoration-none">
              <p class="mb-1 text-muted">Season by Season</p>
            </a>
            <h1 class="mb-0">Search Results</h1>
          </div>

          <a class="btn btn-outline-dark" href="home.html">Back Home</a>
        </div>

        <!-- Search bar -->
        <form class="search-wrap mb-4 d-flex gap-2">
          <input
            type="text"
            class="form-control search-input"
            placeholder="Enter zipcode..."
            aria-label="Search"
          />
          <button class="btn btn-outline-dark">Search</button>
        </form>

        <!-- Results header -->
        <div class="mb-4">
          <p class="text-muted mb-1">Showing {number} recipes</p>
        </div>

        <!-- Result Card 1 -->
        <div class="recipe-card p-4 mb-4">
          <div class="row align-items-center g-4">
            <div class="col-12 col-md-7">
              <h2 class="h4">Classic Chicken Noodle Soup</h2>

              <div class="d-flex gap-2 flex-wrap my-3">
                <span class="tag tag-season winter">Winter</span>
              </div>

              <a href="test.html" class="btn btn-dark">View Recipe</a>
            </div>

            <div class="col-12 col-md-5">
              <img
                class="recipe-map"
                src="https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=900&q=80"
                alt="Soup"
              />
            </div>
          </div>
        </div>

        <!-- Result Card 2 -->
        <div class="recipe-card p-4 mb-4">
          <div class="row align-items-center g-4">
            <div class="col-12 col-md-7">
              <h2 class="h4">Creamy Tomato Basil Soup</h2>

              <div class="d-flex gap-2 flex-wrap my-3">
                <span class="tag tag-season fall">Fall</span>
              </div>

              <a href="test.html" class="btn btn-dark">View Recipe</a>
            </div>

            <div class="col-12 col-md-5">
              <img
                class="recipe-map"
                src="https://images.unsplash.com/photo-1604909052743-94e838986d24?auto=format&fit=crop&w=900&q=80"
                alt="Tomato Soup"
              />
            </div>
          </div>
        </div>

        <!-- Result Card 3 -->
        <div class="recipe-card p-4 mb-4">
          <div class="row align-items-center g-4">
            <div class="col-12 col-md-7">
              <h2 class="h4">Quick Vegetable Soup</h2>

              <div class="d-flex gap-2 flex-wrap my-3">
                <span class="tag tag-season summer">Summer</span>
              </div>

              <a href="test.html" class="btn btn-dark">View Recipe</a>
            </div>

            <div class="col-12 col-md-5">
              <img
                class="recipe-map"
                src="https://picfiles.alphacoders.com/272/272777.jpg"
                alt="Vegetable Soup"
              />
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="AllergyFilter.js"></script>
  </body>
</html>
