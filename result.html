<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results | Season by Season</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <div class="content-wrap">
        <!-- Top header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <a href="home.html" class="text-decoration-none">
              <p class="mb-1 text-muted">Season by Season</p>
            </a>
            <h1 class="mb-0">Search Results</h1>
          </div>

          <a class="btn btn-outline-dark" href="home.html">Back Home</a>
        </div>

        <!-- Search bar -->
        <form class="search-wrap mb-4 d-flex gap-2">
          <input
            type="text"
            class="form-control search-input"
            placeholder="Enter zipcode..."
            aria-label="Search"
          />
          <button class="btn btn-outline-dark">Search</button>
        </form>

        <!-- Results header -->
        <div class="mb-4">
          <p class="text-muted mb-1" data-recipe-count>Showing 0 recipes</p>
          <p class="small text-muted mb-0" data-location-line></p>
        </div>
        <div class="region-info">
          <h2 id="region-name"></h2>

          <img 
            id="region-image"
            alt="Region image"
            style="max-width: 400px; display:block; margin-bottom:10px;"
          />

          <img 
            id="store-image"
            alt="Store image"
            style="max-width: 300px; display:none; margin-bottom:10px;"
          />

          <p id="store-name"></p>
        </div>
        <div data-results></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="ZipCodeSearch.js"></script>
    <script src="zipregionimages.js"></script>
    <script src="AllergyFilter.js"></script>
    <script src="awsConfig.js"></script>
    <script src="apiClient.js"></script>
    <script src="appResults.js"></script>
  </body>
</html>
